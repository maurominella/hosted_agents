# Unique identifier/name for this agent
name: ha03-echoagent-fmi-path

# Brief description of what this agent does
description: >
  This sample demonstrates how to create a custom AI agent and how to extract caller identity
  (object ID and tenant ID) from the request context via ContextVarUserProvider.
  It is useful for testing, debugging, and verifying that user identity is correctly propagated
  both in local simulation (via x-aml-oid / x-aml-tid headers) and in real Microsoft Foundry execution.

metadata:
  # Categorization tags for organizing and discovering agents
  tags:
    - AI Agent Hosting
    - Azure AI AgentServer
    - Custom Agent Implementation
    - Microsoft Agent Framework
    - User Identity
    - fmi_path
    - ContextVarUserProvider

template:
  name: ha03-echoagent-fmi-path
  kind: hosted
  protocols:
    - protocol: responses
      version: v1
  environment_variables:
    # https://<foundry_account>.services.ai.azure.com/api/projects/<foundry_project>, gpt-4o
    - name: AIF_STD_PROJECT_ENDPOINT    
      value: ${AIF_STD_PROJECT_ENDPOINT}
    - name: MODEL_DEPLOYMENT_NAME
      value: ${MODEL_DEPLOYMENT_NAME}
