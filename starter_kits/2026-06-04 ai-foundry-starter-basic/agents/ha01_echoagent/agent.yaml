# Unique identifier/name for this agent
name: ha01-echoagent

# Brief description of what this agent does
description: >
  This sample demonstrates how to create a custom AI agent answer a simple question.  
  It is useful for testing, debugging, and learning how to build custom agents.

metadata:
  # Categorization tags for organizing and discovering agents
  tags:
    - AI Agent Hosting
    - Azure AI AgentServer
    - Custom Agent Implementation
    - Microsoft Agent Framework

template:
  name: ha01-echoagent
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    # OpenTelemetry service name -> becomes cloud_RoleName in App Insights,
    # so this agent's logs/traces are easy to isolate from APIM (mmapim04) noise.
    - name: OTEL_SERVICE_NAME
      value: ha01-echoagent
    # https://<foundry_account>.services.ai.azure.com/api/projects/<foundry_project>, gpt-4o
    - name: AIF_STD_PROJECT_ENDPOINT    
      value: ${AIF_STD_PROJECT_ENDPOINT}
    - name: MODEL_DEPLOYMENT_NAME
      value: ${MODEL_DEPLOYMENT_NAME}
    # App-OBO (downstream OBO) credentials for the Token C -> Graph exchange
    # use azd env set APP_OBO_TENANT_ID 3ad***
    - name: APP_OBO_TENANT_ID
      value: ${APP_OBO_TENANT_ID}
    - name: APP_OBO_CLIENT_ID
      value: ${APP_OBO_CLIENT_ID}
    - name: APP_OBO_CLIENT_SECRET
      value: ${APP_OBO_CLIENT_SECRET}