# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: ha02-agentserverresponses-llmagent
description: |
    Hosted container agent exposing  the responses protocol.
metadata:
    tags:
        - AI Agent Hosting
        - Responses Protocol
        - Bring Your Own
        - Python
protocols:
    - protocol: responses
      version: 2.0.0
resources:
    cpu: "0.5"
    memory: 1Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    - name: FOUNDRY_PROJECT_ENDPOINT
      value: ${FOUNDRY_PROJECT_ENDPOINT}
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    - name: CLIENT_USER_TOKEN_HEADER
      value: ${CLIENT_USER_TOKEN_HEADER}
    - name: APPLICATIONINSIGHTS_CONNECTION_STRING
      value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
      value: ${AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING}
    - name: ENABLE_SENSITIVE_DATA
      value: ${ENABLE_SENSITIVE_DATA}
