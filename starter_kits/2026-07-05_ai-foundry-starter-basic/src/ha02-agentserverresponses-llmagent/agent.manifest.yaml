# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/AgentManifest.yaml
name: ha02-agentserverresponses-llmagent
displayName: "HA02 Agent Server Responses (LLM Agent)"
description: >
  Hosted container agent exposing 
  the responses protocol.
metadata:
  tags:
    - AI Agent Hosting
    - Responses Protocol
    - Bring Your Own
    - Python
template:
  name: ha02-agentserverresponses-llmagent
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    # FOUNDRY_PROJECT_ENDPOINT and APPLICATIONINSIGHTS_CONNECTION_STRING
    # are injected by the platform (hosted) and translated by azd (local)
    # — do NOT declare them here.
    #
    # Model deployment name — resolved from the resources section below.
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    - name: FOUNDRY_PROJECT_ENDPOINT
      value: ${FOUNDRY_PROJECT_ENDPOINT}
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    - name: CLIENT_USER_TOKEN_HEADER
      value: ${CLIENT_USER_TOKEN_HEADER}
    - name: APPLICATIONINSIGHTS_CONNECTION_STRING
      value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
      value: ${AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING}
    - name: ENABLE_SENSITIVE_DATA
      value: ${ENABLE_SENSITIVE_DATA}
resources:
  - kind: model
    id: gpt-5.4-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME