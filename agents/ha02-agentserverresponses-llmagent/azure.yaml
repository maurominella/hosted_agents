# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: ha02-agentserverresponses-llmagent
services:
    ai-project:
        project: ""
        host: azure.ai.project
        language: ""
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 500
                name: GlobalStandard
    ha02-agentserverresponses-llmagent:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.25"
                memory: 0.5Gi
        description: Minimal Hello World agent using the Responses protocol with a bring-your-own approach. Calls a Foundry model via the Responses API and returns the response.
        displayName: Hello World (Python, Responses)
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: CLIENT_USER_TOKEN_HEADER
              value: ${CLIENT_USER_TOKEN_HEADER}
            - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
              value: ${AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING}
            - name: ENABLE_SENSITIVE_DATA
              value: ${ENABLE_SENSITIVE_DATA}
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - Bring Your Own
                - Python
        name: ha02-agentserverresponses-llmagent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
