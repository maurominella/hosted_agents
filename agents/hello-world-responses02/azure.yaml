# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: hello-world-python-responses
services:
  hello-world-python-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Bring Your Own
        - Python
    project: src/hello-world-python-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    kind: hosted
    name: hello-world-responses02
    displayName: Hello World (Python, Responses)
    description: Minimal Hello World agent using the Responses protocol with a bring-your-own approach. Calls a Foundry model via the Responses API and returns the response.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: KEY_VAULT_URL
        value: ${KEY_VAULT_URL}
      - name: APP_OBO_TENANT_ID
        value: ${APP_OBO_TENANT_ID}
      - name: APP_OBO_CLIENT_ID
        value: ${APP_OBO_CLIENT_ID}
      - name: APP_OBO_CLIENT_SECRET_NAME
        value: ${APP_OBO_CLIENT_SECRET_NAME}
      - name: GRAPH_SCOPES
        value: ${GRAPH_SCOPES}
      - name: CLIENT_USER_TOKEN_HEADER
        value: ${CLIENT_USER_TOKEN_HEADER}
      - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
        value: ${AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING}
      - name: ENABLE_SENSITIVE_DATA
        value: ${ENABLE_SENSITIVE_DATA}

    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
